<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enchanter</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #e0e0e0;
    --dim: #888888;
    --green: #4af07a;
    --cyan: #67d6f0;
    --red: #f06a6a;
    --panel: #141414;
    --border: #262626;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
  }
  #statusbar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    align-items: center;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  #content {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: row;
  }
  #main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  #statusbar .logo { color: var(--cyan); font-weight: bold; }
  #statusbar .dim { color: var(--dim); }
  #statusbar select {
    background: #000;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 3px;
    font: inherit;
    font-size: 12px;
    padding: 2px 6px;
    max-width: 240px;
  }
  #statusbar button {
    background: #000;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 3px;
    font: inherit;
    font-size: 12px;
    padding: 3px 10px;
    cursor: pointer;
  }
  #statusbar button:hover { border-color: var(--cyan); color: var(--cyan); }
  #statusbar .spacer { flex: 1; }
  #sessionTitle { color: var(--dim); font-size: 12px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #titleBtn {
    background: #000;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 3px;
    font: inherit;
    font-size: 12px;
    padding: 2px 8px;
    cursor: pointer;
  }
  #titleBtn:hover { border-color: var(--cyan); color: var(--green); }
  #leftpanel {
    width: 280px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 10px 12px;
    font-size: 12px;
  }
  #leftpanel .panel-head {
    color: var(--cyan);
    font-weight: bold;
    margin-bottom: 8px;
    user-select: none;
  }
  #leftpanel .empty { color: var(--dim); font-style: italic; }
  #sidebar {
    width: 280px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 10px 12px;
    font-size: 12px;
  }
  #sidebar details {
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #000;
    padding: 6px 8px;
  }
  #sidebar summary {
    cursor: pointer;
    color: var(--cyan);
    user-select: none;
    margin-bottom: 4px;
  }
  #sidebar .skill-line { margin: 5px 0; }
  #sidebar .skill-name { color: var(--green); }
  #sidebar .skill-cat { color: var(--dim); }
  #sidebar .skill-desc { color: var(--dim); font-size: 11px; }
  #sidebar .mcp-server { margin: 6px 0; }
  #sidebar .mcp-name { color: var(--cyan); }
  #sidebar .mcp-transport { color: var(--dim); font-size: 11px; }
  #sidebar .mcp-tools { margin: 3px 0 0 14px; color: var(--dim); font-size: 11px; }
  #sidebar .mcp-tools li { margin: 2px 0; }
  #sidebar .mcp-empty { color: var(--dim); font-style: italic; }
  @media (max-width: 900px) {
    #content { flex-direction: column; }
    #leftpanel { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
    #sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); max-height: 40vh; }
  }
  #status { color: var(--dim); font-size: 12px; padding: 4px 14px; height: 27px; }
  #status.busy { color: var(--cyan); }
  #status.error { color: var(--red); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }
  .row { margin-bottom: 14px; animation: fadein .15s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .who { font-size: 12px; margin-bottom: 3px; }
  .who.user { color: var(--cyan); }
  .who.assistant { color: var(--green); }
  .bubble { white-space: pre-wrap; word-break: break-word; }
  .txt { white-space: pre-wrap; }
  .tool {
    margin: 6px 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel);
    overflow: hidden;
  }
  .tool summary {
    cursor: pointer;
    padding: 6px 10px;
    color: var(--cyan);
    font-size: 12px;
    user-select: none;
  }
  .tool pre {
    margin: 0;
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
    color: #b8b8b8;
  }
  .tool .args { color: var(--dim); }
  .tool .ok { color: var(--green); }
  .tool .err { color: var(--red); }
  .note { color: var(--dim); font-size: 12px; font-style: italic; }
  .err-row { color: var(--red); }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: var(--green);
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #inputbar {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 10px 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #promptbox {
    flex: 1;
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
  }
  #input {
    flex: 1;
    background: #000;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px;
    font: inherit;
    padding: 9px 12px;
    resize: none;
    height: 42px;
    max-height: 180px;
  }
  #input:focus { outline: none; border-color: var(--green); }
  #send {
    background: var(--green);
    color: #000;
    border: none;
    border-radius: 4px;
    font: inherit;
    font-weight: bold;
    padding: 0 18px;
    cursor: pointer;
  }
  #send:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
  <div id="statusbar">
    <span class="logo">⟡ Enchanter</span>
    <span class="dim">model</span> <select id="modelSel" title="Switch model / provider"></select>
    <span class="dim">session</span> <select id="sessionSel" title="Resume a previous session"><option value="">new session</option></select>
    <button id="titleBtn" title="Rename current session">✎</button>
    <span id="sessionTitle" class="dim"></span>
    <span id="ctxInfo" class="dim"></span>
    <span class="spacer"></span>
    <button id="undoBtn" title="Undo last exchange">Undo</button>
    <button id="retryBtn" title="Retry last user message">Retry</button>
    <button id="clearBtn" title="Start a new session">New session</button>
  </div>
  <div id="content">
    <aside id="leftpanel">
      <div class="panel-head">tools</div>
      <div id="toolList"></div>
    </aside>
    <div id="main">
      <div id="status"></div>
      <div id="messages"></div>
      <div id="inputbar">
        <div id="promptbox">
          <textarea id="input" placeholder="Ask enchanter… (Enter sends, Shift+Enter newline)" rows="1"></textarea>
          <button id="send" disabled>Send</button>
        </div>
      </div>
    </div>
    <aside id="sidebar">
      <details open id="skillsPanel">
        <summary>skills · 0</summary>
        <div id="skillsList"></div>
      </details>
      <details id="mcpPanel">
        <summary>mcp servers · 0</summary>
        <div id="mcpList"></div>
      </details>
    </aside>
  </div>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const messagesEl = $("messages");
  const toolListEl = $("toolList");
  const inputEl = $("input");
  const sendBtn = $("send");
  const modelSel = $("modelSel");
  const sessionSel = $("sessionSel");

  let busy = false;
  let lastUser = "";
  let streamRow = null; // { row, text, cursor } for the active assistant stream
  let lastResources = ""; // serialized /api/resources payload for flicker-free re-render

  function setStatus(msg, cls) {
    statusEl.textContent = msg || "";
    statusEl.className = cls || "";
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function fmtTokens(n) {
    if (n == null) return "–";
    if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
    if (n >= 1000) return (n / 1000).toFixed(1) + "k";
    return String(n);
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderStatus(s) {
    $("sessionTitle").textContent = s.session_title || "";
    $("ctxInfo").textContent =
      "ctx " + fmtTokens(s.estimated_context_tokens) +
      (s.context_budget != null ? "/" + fmtTokens(s.context_budget) : "") +
      " · in " + fmtTokens(s.token_usage.prompt_tokens) +
      " · out " + fmtTokens(s.token_usage.completion_tokens) +
      " · tools " + s.tool_count +
      (s.mcp_tool_count ? "+" + s.mcp_tool_count + " MCP" : "") +
      " · skills " + s.skill_count +
      " · turns " + (s.max_turns != null ? s.max_turns : "∞") +
      (s.soft_limit != null ? " (soft " + s.soft_limit + ")" : "");
    if (s.model && !modelSel.options.namedItem(s.model)) {
      const opt = document.createElement("option");
      opt.value = s.model;
      opt.textContent = s.model + " (default)";
      modelSel.add(opt);
    }
  }

  function addRow(role, text) {
    const row = document.createElement("div");
    row.className = "row";
    const who = document.createElement("div");
    who.className = "who " + role;
    who.textContent = role === "user" ? "⟩ you" : "⟨ enchanter";
    row.appendChild(who);
    const body = document.createElement("div");
    body.className = "bubble";
    body.innerHTML = text; // caller provides already-escaped text
    row.appendChild(body);
    messagesEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function ensureStreamRow() {
    if (streamRow) return streamRow;
    const row = document.createElement("div");
    row.className = "row";
    const who = document.createElement("div");
    who.className = "who assistant";
    who.textContent = "⟨ enchanter";
    row.appendChild(who);
    const body = document.createElement("div");
    body.className = "bubble";
    const text = document.createElement("span");
    text.className = "txt";
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    body.appendChild(text);
    body.appendChild(cursor);
    row.appendChild(body);
    messagesEl.appendChild(row);
    scrollBottom();
    streamRow = { row, text, cursor };
    return streamRow;
  }

  function addTool(tc) {
    if (toolListEl.querySelector(".empty")) toolListEl.innerHTML = "";
    const det = document.createElement("details");
    det.className = "tool";
    det.dataset.id = tc.id;
    det.open = true;
    const sum = document.createElement("summary");
    sum.textContent = "▸ " + tc.name + "()";
    det.appendChild(sum);
    const argsPre = document.createElement("pre");
    argsPre.className = "args";
    let argsStr = tc.arguments || "";
    try { argsStr = JSON.stringify(JSON.parse(argsStr), null, 2); } catch (e) { /* keep raw */ }
    argsPre.textContent = argsStr;
    det.appendChild(argsPre);
    toolListEl.appendChild(det);
    toolListEl.scrollTop = toolListEl.scrollHeight;
  }

  function addToolResult(id, content) {
    const det = toolListEl.querySelector('.tool[data-id="' + CSS.escape(id) + '"]');
    if (!det) return;
    const resPre = document.createElement("pre");
    resPre.className = content.startsWith("Error") ? "err" : "ok";
    resPre.textContent = content;
    det.appendChild(resPre);
    const sum = det.querySelector("summary");
    if (sum) sum.textContent = "▾ " + sum.textContent.replace(/^[▸▾]\s*/, "") + " ✓";
    toolListEl.scrollTop = toolListEl.scrollHeight;
  }

  function note(text) {
    const row = document.createElement("div");
    row.className = "row note";
    row.textContent = text;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  // ── SSE streaming ──
  function startStream(url, body) {
    busy = true;
    setInputLocked(true);
    streamRow = null;
    setStatus("streaming…", "busy");

    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
      .then((resp) => {
        if (!resp.ok) {
          return resp.json().then((j) => {
            throw new Error(j.error || ("HTTP " + resp.status));
          });
        }
        if (!resp.body) throw new Error("no response body");
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        const pump = () =>
          reader.read().then(({ done, value }) => {
            if (done) { finish(); return; }
            buf += decoder.decode(value, { stream: true });
            let idx;
            while ((idx = buf.indexOf("\n\n")) >= 0) {
              const frame = buf.slice(0, idx);
              buf = buf.slice(idx + 2);
              const line = frame.split("\n").find((l) => l.startsWith("data:"));
              if (!line) continue;
              handleEvent(JSON.parse(line.slice(5).trim()));
            }
            return pump();
          });
        return pump();
      })
      .catch((err) => {
        setStatus("error: " + err.message, "error");
        finish();
      });
  }

  function handleEvent(ev) {
    switch (ev.type) {
      case "content":
        ensureStreamRow().text.textContent += ev.text;
        scrollBottom();
        break;
      case "tool_call":
        addTool({ id: ev.id, name: ev.name, arguments: ev.arguments });
        break;
      case "tool_result":
        setStatus("tool result…", "busy");
        addToolResult(ev.id, ev.content);
        break;
      case "compacted":
        note("compacted " + ev.removed_messages + " earlier messages (~" + ev.budget_tokens + " tokens)");
        break;
      case "usage":
        setStatus("done · in " + fmtTokens(ev.prompt_tokens) + " · out " + fmtTokens(ev.completion_tokens) + " · ctx " + fmtTokens(ev.estimated_context_tokens) + (ev.context_budget != null ? "/" + fmtTokens(ev.context_budget) : ""), "");
        break;
      case "error":
        setStatus("error: " + ev.message, "error");
        break;
      case "done":
        finish();
        break;
    }
  }

  function setInputLocked(locked) {
    sendBtn.disabled = locked || !inputEl.value.trim();
    inputEl.disabled = locked;
    if (!locked) inputEl.focus();
  }

  function finish() {
    busy = false;
    if (streamRow) {
      streamRow.cursor.remove();
      streamRow = null;
    }
    setInputLocked(false);
    setStatus("");
    pollStatus();
    loadSessions();
    loadResources();
  }

  // ── actions ──
  function sendPrompt() {
    const prompt = inputEl.value.trim();
    if (!prompt || busy) return;
    lastUser = prompt;
    addRow("user", esc(prompt));
    inputEl.value = "";
    setInputLocked(true);
    startStream("/api/chat", { prompt });
  }

  function retry() {
    if (busy) return;
    if (!lastUser) { setStatus("nothing to retry", "error"); return; }
    addRow("user", esc(lastUser) + ' <span class="note">(retry)</span>');
    startStream("/api/chat/retry", {});
  }

  function undo() {
    if (busy) return;
    fetch("/api/undo", { method: "POST" })
      .then((r) => r.json())
      .then((j) => {
        if (j.ok) pollStatus();
        else setStatus("undo: " + (j.error || "failed"), "error");
      })
      .catch((e) => setStatus("undo: " + e.message, "error"));
  }

  function clearChat() {
    if (busy) return;
    if (!confirm("Start a new session? The current one is kept on disk.")) return;
    fetch("/api/clear", { method: "POST" })
      .then((r) => r.json())
      .then((j) => {
        if (!j.ok) { setStatus("clear: " + (j.error || "failed"), "error"); return; }
        messagesEl.innerHTML = "";
        toolListEl.innerHTML = '<div class="empty">no tool calls yet</div>';
        note("new session " + (j.status ? j.status.session_id : ""));
        renderStatus(j.status || {});
        pollStatus();
        loadResources();
      })
      .catch((e) => setStatus("clear: " + e.message, "error"));
  }

  function switchModel(name) {
    fetch("/api/model", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    })
      .then((r) => r.json())
      .then((j) => {
        if (j.ok) {
          note("switched model → " + (j.label || name));
          pollStatus();
        } else {
          setStatus("model: " + (j.error || "failed"), "error");
          loadModels();
        }
      })
      .catch((e) => setStatus("model: " + e.message, "error"));
  }

  function resumeSession(id) {
    if (busy || !id) return;
    fetch("/api/chat/resume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: id }),
    })
      .then((r) => r.json())
      .then((j) => {
        if (!j.ok) { setStatus("resume: " + (j.error || "failed"), "error"); return; }
        messagesEl.innerHTML = "";
        toolListEl.innerHTML = '<div class="empty">no tool calls yet</div>';
        (j.history || []).forEach((m) => {
          if (m.role === "system" || m.role === "tool") return;
          if (m.role === "assistant" && !m.content) return;
          addRow(m.role, esc(m.content || ""));
        });
        note("resumed session " + id + " · new turns will be appended");
        renderStatus(j.status || {});
        pollStatus();
        loadResources();
      })
      .catch((e) => setStatus("resume: " + e.message, "error"));
  }

  // ── polling ──
  function pollStatus() {
    if (busy) return;
    fetch("/api/status")
      .then((r) => r.json())
      .then(renderStatus)
      .catch(() => {});
  }

  function loadModels() {
    fetch("/api/models")
      .then((r) => r.json())
      .then((j) => {
        modelSel.innerHTML = "";
        (j.providers || []).forEach((p) => {
          const opt = document.createElement("option");
          opt.value = p.name;
          opt.textContent = p.name + " → " + p.model;
          modelSel.add(opt);
        });
        if (j.current && !modelSel.options.namedItem(j.current)) {
          const opt = document.createElement("option");
          opt.value = j.current;
          opt.textContent = j.current + " (default)";
          modelSel.add(opt);
        }
        modelSel.value = j.current || modelSel.value;
      })
      .catch(() => {});
  }

  function loadSessions() {
    fetch("/api/sessions")
      .then((r) => r.json())
      .then((j) => {
        sessionSel.innerHTML = '<option value="">new session</option>';
        (j.sessions || []).forEach((s) => {
          const opt = document.createElement("option");
          opt.value = s.id;
          const label = (s.title && s.title.trim())
            ? s.title
            : s.id.slice(0, 8) + "…";
          opt.textContent = label + " · " + s.message_count + " msgs";
          sessionSel.add(opt);
        });
      })
      .catch(() => {});
  }

  function renderSidebar(j) {
    const skillsEl = $("skillsList");
    const skills = j.skills || [];
    $("skillsPanel").querySelector("summary").textContent = "skills · " + skills.length;
    skillsEl.innerHTML = "";
    skills.forEach((s) => {
      const line = document.createElement("div");
      line.className = "skill-line";
      const name = document.createElement("span");
      name.className = "skill-name";
      name.textContent = (s.category ? "[" + s.category + "] " : "") + s.name;
      line.appendChild(name);
      if (s.description) {
        const desc = document.createElement("div");
        desc.className = "skill-desc";
        desc.textContent = s.description;
        line.appendChild(desc);
      }
      skillsEl.appendChild(line);
    });

    const mcpEl = $("mcpList");
    const mcp = j.mcp || [];
    $("mcpPanel").querySelector("summary").textContent = "mcp servers · " + mcp.length;
    mcpEl.innerHTML = "";
    if (mcp.length === 0) {
      const empty = document.createElement("div");
      empty.className = "mcp-empty";
      empty.textContent = "no MCP servers";
      mcpEl.appendChild(empty);
      return;
    }
    mcp.forEach((srv) => {
      const box = document.createElement("div");
      box.className = "mcp-server";
      const name = document.createElement("span");
      name.className = "mcp-name";
      name.textContent = srv.name;
      box.appendChild(name);
      if (srv.transport) {
        const tr = document.createElement("span");
        tr.className = "mcp-transport";
        tr.textContent = " (" + srv.transport + ")";
        box.appendChild(tr);
      }
      if (srv.tools && srv.tools.length) {
        const ul = document.createElement("ul");
        ul.className = "mcp-tools";
        srv.tools.forEach((t) => {
          const li = document.createElement("li");
          li.textContent = t.name + (t.description ? " — " + t.description : "");
          ul.appendChild(li);
        });
        box.appendChild(ul);
      }
      mcpEl.appendChild(box);
    });
  }

  function loadResources() {
    fetch("/api/resources")
      .then((r) => r.json())
      .then((j) => {
        const key = JSON.stringify(j);
        if (key === lastResources) return;
        lastResources = key;
        renderSidebar(j);
      })
      .catch(() => {});
  }

  function renameSession() {
    if (busy) return;
    const current = $("sessionTitle").textContent || "";
    const title = prompt("Session title:", current);
    if (title == null) return;
    fetch("/api/session/title", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: title.trim() }),
    })
      .then((r) => r.json())
      .then((j) => {
        if (j.ok) {
          pollStatus();
          loadSessions();
        } else {
          setStatus("rename: " + (j.error || "failed"), "error");
        }
      })
      .catch((e) => setStatus("rename: " + e.message, "error"));
  }

  // ── wiring ──
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendPrompt();
    }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
    sendBtn.disabled = busy || !inputEl.value.trim();
  });
  sendBtn.addEventListener("click", (e) => { e.preventDefault(); sendPrompt(); });
  modelSel.addEventListener("change", () => { if (modelSel.value) switchModel(modelSel.value); });
  sessionSel.addEventListener("change", () => { if (sessionSel.value) resumeSession(sessionSel.value); });
  $("undoBtn").addEventListener("click", undo);
  $("retryBtn").addEventListener("click", retry);
  $("clearBtn").addEventListener("click", clearChat);
  $("titleBtn").addEventListener("click", renameSession);

  setInterval(pollStatus, 3000);
  setInterval(loadResources, 3000);

  // ── init ──
  toolListEl.innerHTML = '<div class="empty">no tool calls yet</div>';
  pollStatus();
  loadModels();
  loadSessions();
  loadResources();
  sendBtn.disabled = true;
  inputEl.focus();
})();
</script>
</body>
</html>
